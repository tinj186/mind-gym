services:
  db:
    image: postgres:15-alpine
    container_name: mind_gym_db_v2
    environment:
      POSTGRES_USER: gym_admin
      POSTGRES_PASSWORD: GymPassword123
      POSTGRES_DB: mindgym
    ports:
      - "5434:5432"
    volumes:
      - gym_db_data_v2:/var/lib/postgresql/data

  web:
    image: node:22-alpine
    container_name: mind_gym_web_v2
    working_dir: /app
    volumes:
      - .:/app
      - /app/.next
      - /app/node_modules
    environment:
      DATABASE_URL: "postgresql://gym_admin:GymPassword123@db:5432/mindgym?schema=public"
      WATCHPACK_POLLING: "true"
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3001:3001"
      - "5555:5555"
    command: >
      sh -c "
      find . -name '@eaDir' -type d -exec rm -rf {} + || true &&
      ( [ -d .next ] && find .next -mindepth 1 -delete || true ) &&
      rm -rf node_modules/.cache &&
      npm install &&
      npx prisma generate &&
      npm run dev"
    depends_on:
      - db

volumes:
  gym_db_data_v2: