services:
  db:
    image: postgres:15-alpine
    container_name: mind_gym_db_v2
    environment:
      POSTGRES_USER: ${DB_USER:-gym_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindgym_pass}
      POSTGRES_DB: ${DB_NAME:-mindgym}
    expose:
      - "5432"
    ports:
      - "5433:5432"
    volumes:
      - gym_db_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gym_admin} -d $${POSTGRES_DB:-mindgym}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mind_gym_net

  web:
    # Using the full bookworm image ensures openssl and ca-certificates 
    # are pre-installed, preventing Prisma engine detection failures.
    image: node:22-bookworm
    container_name: mind_gym_web_v2
    # Ensure the container cannot gain new privileges
    security_opt:
      - no-new-privileges:true
    # If your app doesn't need to write files at runtime, set to true.
    # Note: npm install and prisma generate usually need write access during build.
    read_only: false
    user: "1026:1026" # Run as non-privileged user
    working_dir: /app
    volumes:
      - .:/app
      # Removed the named 'node_modules' volume. 
      # This ensures npm uses the folder directly in your project directory
      # which inherits the correct permissions from your Synology user.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      WATCHPACK_POLLING: "true"
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm-cache
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: 1
      PRISMA_STUDIO_HOSTNAME: "0.0.0.0"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NO_UPDATE_NOTIFIER: "true"
      PRISMA_CLI_QUERY_ENGINE_TYPE: "binary"
      PRISMA_CLIENT_ENGINE_TYPE: "binary"
      # The Access Code for the student login portal
      NEXT_PUBLIC_APP_ACCESS_CODE: ${APP_ACCESS_CODE:-gym-2026}
      # Verbose logging to monitor the initial build progress
      NPM_CONFIG_LOGLEVEL: info
    ports:
      - "3001:3001"
      - "5555:5555"
    command: >
      bash -c "
      cd /app && 
      chmod -R +x node_modules/@prisma/engines node_modules/.prisma 2>/dev/null || true &&
      rm -rf /tmp/.config/prisma-nodejs && mkdir -p /tmp/.config/prisma-nodejs &&
      export PRISMA_SKIP_POSTINSTALL_GENERATE=1 &&
      (npm install --no-audit --no-fund || (sleep 5 && npm install --no-audit --no-fund)) && 
      echo '⏳ Waiting for network stabilization...' && sleep 15 &&
      npx prisma generate && 
      echo '🚀 Synchronizing database...' &&
      for i in {1..10}; do npx prisma db push && break || (echo 'Retrying DB connection in 5s...' && sleep 5); done &&
      chmod -R +x node_modules/@prisma/engines node_modules/.prisma &&
      npm run dev"
    networks:
      - mind_gym_net

volumes:
  gym_db_data_v2:

networks:
  mind_gym_net:
    driver: bridge